
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Touch to see your surprise</title>
  <style>
    body {
      background-color: #ffe6f0;
      text-align: center;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      padding: 50px;
    }
    h1 {
      font-size: 2em;
      color: #ff1493;
      animation: shimmer 2s infinite;
    }
    @keyframes shimmer {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
    .gift {
      margin-top: 30px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    .gift:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <h1>✨ Touch to see your surprise ✨</h1>
  <a href="https://drive.google.com/file/d/1i9XoUjZ1YMTPGpJ_36E7LWI5e2Acx9cq/preview" target="_blank">
    <img class="gift" src="https://media.giphy.com/media/3o6ZsX2d6DSZzYJZmU/giphy.gif" alt="Gift Box Animation" width="200">
  </a>
</body>
</html>
