
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Giftbox Surprise</title>
  <style>
    body {
      background-color: #ffe6f0;
      font-family: 'Arial', sans-serif;
      text-align: center;
      padding-top: 50px;
    }
    .title {
      font-size: 2em;
      color: #ff3399;
      font-weight: bold;
      animation: shimmer 2s infinite;
      margin-bottom: 40px;
    }
    @keyframes shimmer {
      0% {opacity: 0.8;}
      50% {opacity: 1;}
      100% {opacity: 0.8;}
    }
    .gift {
      width: 150px;
      cursor: pointer;
      transition: transform 0.3s ease-in-out;
    }
    .gift:hover {
      transform: scale(1.1);
    }
    video {
      display: none;
      margin-top: 20px;
      max-width: 90%;
    }
  </style>
</head>
<body>
  <div class="title">Touch to see your surprise</div>
  <img src="https://media.giphy.com/media/3oz8xAFtqoOUUrsh7W/giphy.gif" class="gift" onclick="showVideo()">
  <video id="surpriseVideo" controls>
    <source src="https://drive.google.com/uc?export=download&id=1k55HNlddo9nVSqwIsOPZli1YEL0vXzqI" type="video/mp4">
    Your browser does not support the video tag.
  </video>
  <script>
    function showVideo() {
      const video = document.getElementById('surpriseVideo');
      video.style.display = 'block';
      video.play();
    }
  </script>
</body>
</html>
