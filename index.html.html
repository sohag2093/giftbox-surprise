
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🎁 A Romantic Surprise</title>
  <style>
    body {
      background: linear-gradient(135deg, #ffe0ec, #f8d0ff, #e0ffe4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      text-align: center;
      padding: 20px;
      overflow: hidden;
    }
    h2 {
      color: #ff1493;
      font-size: 30px;
      margin-bottom: 30px;
      text-shadow: 1px 1px 3px #ff69b4;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    a img {
      width: 260px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }
    a img:hover {
      transform: scale(1.1);
      box-shadow: 0 14px 30px rgba(0,0,0,0.3);
    }
    .sparkles {
      position: absolute;
      width: 100%;
      height: 100%;
      background: url('https://media.tenor.com/p0G_bmA2fGsAAAAC/stars-sparkle.gif');
      background-size: cover;
      opacity: 0.08;
      z-index: -1;
    }
  </style>
</head>
<body>
  <div class="sparkles"></div>
  <h2>✨ Touch to see your surprise! ✨</h2>
  <a href="https://drive.google.com/file/d/1k55HNlddo9nVSqwIsOPZli1YEL0vXzqI/view?usp=drive_link" target="_blank">
    <img src="https://media.tenor.com/oxfCjl-RT9oAAAAi/happy-birthday-gift.gif" alt="Cute Gift Box Animation" />
  </a>
</body>
</html>
